syntax = "proto3";

package cs3.sharing.ocm.v1beta1;

import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/rpc/v1beta1/status.proto";
import "cs3/sharing/ocm/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/resources.proto";

option csharp_namespace = "Cs3.Sharing.Ocm.V1Beta1";
option go_package = "ocmv1beta1";
option java_multiple_files = true;
option java_outer_classname = "ContactGrantsProto";
option java_package = "com.cs3.sharing.ocm.v1beta1";
option objc_class_prefix = "CSO";
option php_namespace = "Cs3\\Sharing\\Ocm\\V1Beta1";

// Both Idp fields are complete canonical OCM provider hosts. They are not
// aliases for an internal local identity-provider ID. Opaque IDs stay exact.
message OCMContactPair {
  // REQUIRED. Local OCM identity.
  cs3.identity.user.v1beta1.UserId local_user = 1;
  // REQUIRED. Remote OCM identity.
  cs3.identity.user.v1beta1.UserId remote_user = 2;
}

message RevokeOCMContactSharesRequest {
  // REQUIRED. Validated, authorized and provider-bound by the coordinator.
  OCMContactPair pair = 1;
  // OPTIONAL. Directory-confirmed internal identity. When absent, the backend
  // MUST reconcile authoritative stored bindings or fail safely; never guess.
  cs3.identity.user.v1beta1.UserId local_identity = 2;
  // REQUIRED. Stable local operation key; not a federation event identifier.
  string operation_id = 3;
}

// Returned only for an acknowledged durable security commit or authoritative
// absence. Unknown commits MUST return a non-OK status without a receipt.
message OCMContactRevocationReceipt {
  OCMContactPair pair = 1;
  // Exact authoritative internal mapping, if any.
  cs3.identity.user.v1beta1.UserId local_identity = 2;
  string operation_id = 3;
  uint64 epoch = 4;
  uint64 outgoing_denied = 5;
  uint64 projections_denied = 6;
  // True only for this acknowledged newly installed removal operation.
  bool new_operation = 7;
  bool contact_cleanup_pending = 8;
  // No grants, projections, contacts or pending cleanup under the complete
  // fresh-write binding invariant; directory absence alone is insufficient.
  bool authoritative_absence = 9;
}

message RevokeOCMContactSharesResponse {
  cs3.rpc.v1beta1.Status status = 1;
  OCMContactRevocationReceipt receipt = 2;
}

message CompleteOCMContactRemovalRequest {
  OCMContactPair pair = 1;
  string operation_id = 2;
  uint64 epoch = 3;
}

message CompleteOCMContactRemovalResponse {
  cs3.rpc.v1beta1.Status status = 1;
  // False for a stale epoch; never completes a later operation.
  bool completed = 2;
}

message ReopenOCMContactSharesRequest {
  OCMContactPair pair = 1;
  // REQUIRED. Confirmed local identity, separate from the OCM provider host.
  cs3.identity.user.v1beta1.UserId local_identity = 2;
  // REQUIRED. Idempotent locally derived acceptance key, never a raw token.
  // An already consumed key MUST NOT reopen a subsequently revoked pair.
  string acceptance_key = 3;
}

message ReopenOCMContactSharesResponse {
  cs3.rpc.v1beta1.Status status = 1;
  uint64 epoch = 2;
}

message CheckOCMGrantAccessRequest {
  // REQUIRED. Immutable outgoing grant identity from authenticated authority.
  ShareId share_id = 1;
  // REQUIRED. Exact signed user recipient binding.
  cs3.identity.user.v1beta1.UserId grantee = 2;
  // REQUIRED. Resource against which this authority was minted.
  cs3.storage.provider.v1beta1.ResourceId resource_id = 3;
}

message CheckOCMGrantAccessResponse {
  cs3.rpc.v1beta1.Status status = 1;
  // Current restrictions; MUST contain no Token or shared credentials.
  Share share = 2;
}

message GetOCMContactGrantSupportRequest {}

message GetOCMContactGrantSupportResponse {
  cs3.rpc.v1beta1.Status status = 1;
  // True only for durable pair/projection state and every configured access
  // path participating in current grant authorization and writer fencing.
  bool supported = 2;
}
