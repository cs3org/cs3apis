syntax = "proto3";

package cs3.sharing.ocm.v1beta1;

import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/rpc/v1beta1/status.proto";
import "cs3/types/v1beta1/types.proto";
import "cs3/sharing/ocm/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/resources.proto";

option csharp_namespace = "Cs3.Sharing.Ocm.V1Beta1";
option go_package = "ocmv1beta1";
option java_multiple_files = true;
option java_outer_classname = "ContactGrantsProto";
option java_package = "com.cs3.sharing.ocm.v1beta1";
option objc_class_prefix = "CSO";
option php_namespace = "Cs3\\Sharing\\Ocm\\V1Beta1";

// Withdraws every currently committed outgoing OCM share grant that the
// authenticated local user created for exactly this remote user. The local
// user is derived from the authenticated context; the request names only the
// remote user. Grants created later are separate shares, not a revival.
message RemoveOCMSharesForRecipientRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // Exact remote recipient identity of the grants to withdraw. Its idp is
  // the complete canonical host[:port] of the remote provider, opaque IDs
  // stay byte-exact.
  cs3.identity.user.v1beta1.UserId remote_user_id = 2;
}

message RemoveOCMSharesForRecipientResponse {
  // REQUIRED.
  // CODE_OK only for an acknowledged committed selection or no-op; a commit
  // that cannot be established returns CODE_UNKNOWN with changed absent.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Present only for an acknowledged commit or no-op: the number of grants
  // whose state actually changed, zero for a successful no-op.
  optional uint64 changed = 2;
}

// Sets the authenticated local user's currently committed received OCM share
// projections from exactly this remote grantor to REJECTED. The provider's
// own grants are untouched; an explicit later acceptance may reverse it while
// the provider's grant remains active.
message RejectReceivedOCMSharesFromSenderRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // Exact remote creator identity of the received shares to reject. Its idp
  // is the complete canonical host[:port] of the remote provider, opaque IDs
  // stay byte-exact.
  cs3.identity.user.v1beta1.UserId remote_user_id = 2;
}

message RejectReceivedOCMSharesFromSenderResponse {
  // REQUIRED.
  // CODE_OK only for an acknowledged committed selection or no-op; a commit
  // that cannot be established returns CODE_UNKNOWN with changed absent.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Present only for an acknowledged commit or no-op: the number of received
  // share projections whose state actually changed, zero for a no-op.
  optional uint64 changed = 2;
}

message GetOCMShareActionsSupportRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
}

message GetOCMShareActionsSupportResponse {
  // REQUIRED.
  cs3.rpc.v1beta1.Status status = 1;
  // REQUIRED.
  // True only when the configured share repository actually supports the
  // transactional outgoing withdrawal for the authenticated user. A false
  // answer leaves ordinary per-share operations untouched.
  bool withdraw_outgoing = 2;
  // REQUIRED.
  // True only when the configured share repository actually supports the
  // transactional incoming rejection for the authenticated user.
  bool decline_incoming = 3;
}

message CheckOCMGrantAccessRequest {
  // REQUIRED. Immutable outgoing grant identity from authenticated authority.
  ShareId share_id = 1;
  // REQUIRED. Exact signed user recipient binding.
  cs3.identity.user.v1beta1.UserId grantee = 2;
  // REQUIRED. Resource against which this authority was minted.
  cs3.storage.provider.v1beta1.ResourceId resource_id = 3;
}

message CheckOCMGrantAccessResponse {
  cs3.rpc.v1beta1.Status status = 1;
  // Current restrictions; MUST contain no Token or shared credentials.
  Share share = 2;
}
