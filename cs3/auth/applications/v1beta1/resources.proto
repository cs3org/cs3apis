syntax = "proto3";

package cs3.auth.applications.v1beta1;

import "cs3/auth/provider/v1beta1/resources.proto";
import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/resources.proto";
import "cs3/types/v1beta1/types.proto";

option csharp_namespace = "Cs3.Auth.Applications.V1Beta1";
option go_package = "applicationsv1beta1";
option java_multiple_files = true;
option java_outer_classname = "ResourcesProto";
option java_package = "com.cs3.auth.applications.v1beta1";
option objc_class_prefix = "CAA";
option php_namespace = "Cs3\\Auth\\Applications\\V1Beta1";

// AppPassword stores information about secondary passwords generated by users
// to be used with third-party applications.
message AppPassword {
  // OPTIONAL.
  // The secret. It is only set in GenerateAppPasswordResponse and never
  // returned again.
  string password = 1;
  // OPTIONAL.
  // Deprecated: use client and scope.
  // The scope of the token to be issued.
  map<string, cs3.auth.provider.v1beta1.Scope> token_scope = 2 [deprecated = true];
  // OPTIONAL.
  // A label to be associated with the password.
  string label = 3;
  // REQUIRED.
  // The owner of the app password.
  cs3.identity.user.v1beta1.UserId user = 4;
  // OPTIONAL.
  // The time when the token will expire.
  cs3.types.v1beta1.Timestamp expiration = 5;
  // REQUIRED.
  // The creation time of the password.
  cs3.types.v1beta1.Timestamp ctime = 6;
  // REQUIRED.
  // The last time the password was used.
  cs3.types.v1beta1.Timestamp utime = 7;
  // REQUIRED.
  // The id of the app password, used to list and revoke it.
  string id = 8;
  // OPTIONAL.
  // The kind of client the app password is for (e.g. sync, cli, webdav).
  // The values and what they imply are up to the implementation.
  // If not set, the app password can be used by any client.
  string client = 9;
  // OPTIONAL.
  // What the app password can do, and where. If not set, the app password
  // has no restrictions and can do whatever its owner can.
  AppPasswordScope scope = 10;
  // OPTIONAL.
  // Who created the app password, if not the owner (e.g. an admin who
  // created it on the owner's behalf). If not set, it is the owner.
  cs3.identity.user.v1beta1.UserId creator = 11;
}

// AppPasswordScope restricts an app password. A request is allowed only if
// an ability or a grant of the scope covers it, and if the owner can do it.
// Thus an empty scope allows nothing.
message AppPasswordScope {
  // OPTIONAL.
  // The abilities for the requests that are not about a single resource.
  repeated Ability abilities = 1;
  // OPTIONAL.
  // The permissions on resources.
  repeated ResourceGrant grants = 2;
}

// Ability lets an app password do requests that are not about a single resource.
// Some abilities also need a grant on the resource of the request, as given below.
enum Ability {
  ABILITY_INVALID = 0;
  // ListStorageSpaces.
  ABILITY_SPACES_LIST = 1;
  // ListShares, ListReceivedShares, GetReceivedShare, ListPublicShares.
  ABILITY_SHARES_LIST = 2;
  // UpdateReceivedShare, to accept or reject a received share.
  ABILITY_SHARES_RESPOND = 3;
  // FindUsers, FindGroups, GetMembers.
  ABILITY_DIRECTORY_SEARCH = 4;
  // ListLabels, ListResourcesForLabel.
  ABILITY_LABELS_READ = 5;
  // AddLabel, RemoveLabel. Also needs initiate_file_upload on the resource,
  // because a label is stored as an attribute of the resource.
  ABILITY_LABELS_WRITE = 6;
  // GetAppProviders, OpenInApp. OpenInApp also needs on the resource: stat for
  // VIEW_MODE_VIEW_ONLY, initiate_file_download for VIEW_MODE_READ_ONLY,
  // initiate_file_upload for the modes that can write.
  ABILITY_APPS_OPEN = 7;
  // GetKey.
  ABILITY_PREFERENCES_READ = 8;
  // SetKey.
  ABILITY_PREFERENCES_WRITE = 9;
}

// ResourceGrant gives an app password permissions on a resource and on all
// the resources below it. Grants add up: a request on a resource is allowed if
// any grant that covers the resource has the necessary permission.
// A Move needs both the source and the destination to be covered.
//
// Some requests do not have a permission of their own and use these:
//   initiate_file_upload: TouchFile, SetArbitraryMetadata,
//     UnsetArbitraryMetadata, SetLock, RefreshLock, Unlock.
//   stat: GetLock.
message ResourceGrant {
  // OPTIONAL.
  // The resource. It is an id so the grant keeps working when the resource
  // is moved or renamed. If not set, the grant covers all the resources the
  // owner can access.
  cs3.storage.provider.v1beta1.ResourceId resource = 1;
  // REQUIRED.
  // The permissions on the resource.
  cs3.storage.provider.v1beta1.ResourcePermissions permissions = 2;
}

// AppPasswordPreset is a named scope that clients can offer to users when
// they create an app password.
message AppPasswordPreset {
  // REQUIRED.
  // The unique name of the preset.
  string name = 1;
  // OPTIONAL.
  // The name to show to users.
  string display_name = 2;
  // OPTIONAL.
  // The description to show to users.
  string description = 3;
  // OPTIONAL.
  // The kind of client for the app password.
  string client = 4;
  // OPTIONAL.
  // The scope for the app password. Its grants usually have no resource,
  // and the client can set one before it generates the app password.
  // If not set, the app password has no restrictions.
  AppPasswordScope scope = 5;
}
