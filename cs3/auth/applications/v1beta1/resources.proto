syntax = "proto3";

package cs3.auth.applications.v1beta1;

import "cs3/auth/provider/v1beta1/resources.proto";
import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/resources.proto";
import "cs3/types/v1beta1/types.proto";

option csharp_namespace = "Cs3.Auth.Applications.V1Beta1";
option go_package = "applicationsv1beta1";
option java_multiple_files = true;
option java_outer_classname = "ResourcesProto";
option java_package = "com.cs3.auth.applications.v1beta1";
option objc_class_prefix = "CAA";
option php_namespace = "Cs3\\Auth\\Applications\\V1Beta1";

// AppPassword stores information about secondary passwords generated by users
// to be used with third-party applications.
message AppPassword {
  // OPTIONAL.
  // The secret. It is only set in GenerateAppPasswordResponse and never
  // returned again.
  string password = 1;
  // OPTIONAL.
  // Deprecated: use client and grants.
  // The scope of the token to be issued.
  map<string, cs3.auth.provider.v1beta1.Scope> token_scope = 2 [deprecated = true];
  // OPTIONAL.
  // A label to be associated with the password.
  string label = 3;
  // REQUIRED.
  // The owner of the app password.
  cs3.identity.user.v1beta1.UserId user = 4;
  // OPTIONAL.
  // The time when the token will expire.
  cs3.types.v1beta1.Timestamp expiration = 5;
  // REQUIRED.
  // The creation time of the password.
  cs3.types.v1beta1.Timestamp ctime = 6;
  // REQUIRED.
  // The last time the password was used.
  cs3.types.v1beta1.Timestamp utime = 7;
  // REQUIRED.
  // The id of the app password, used to list and revoke it.
  string id = 8;
  // OPTIONAL.
  // The kind of client the app password is for (e.g. sync, cli, webdav).
  // The values and what they imply are up to the implementation.
  // If not set, the app password can be used by any client.
  string client = 9;
  // OPTIONAL.
  // What the app password can do, and where. If empty, the app password
  // has no restrictions and can do whatever its owner can.
  repeated AppPasswordGrant grants = 10;
  // OPTIONAL.
  // Who created the app password, if not the owner (e.g. an admin who
  // created it on the owner's behalf). If not set, it is the owner.
  cs3.identity.user.v1beta1.UserId creator = 11;
}

// AppPasswordGrant gives an app password a role on a resource and everything
// below it, or on the whole account. An app password can never do more than
// its owner, and requests that no permission of its roles covers are refused.
//
// Grants add up: a request on a resource is allowed if the role of any grant
// covering it has the needed permission. A grant covers a resource if it has
// no resource set, or if its resource is that resource or one of its ancestors.
// A request that is not about a single resource (e.g. listing all the shares,
// the recycle bin or searching users) needs a grant on the whole account.
// A Move needs both the source and the destination to be covered.
message AppPasswordGrant {
  // OPTIONAL.
  // The resource the role applies to. It is an id so the grant keeps
  // working when the resource is moved or renamed. If not set, the grant is
  // on the whole account.
  cs3.storage.provider.v1beta1.ResourceId resource = 1;
  // REQUIRED.
  // The name of the cs3.permissions.v1beta1.Role that says what the app
  // password can do on the resource.
  string role = 2;
}
