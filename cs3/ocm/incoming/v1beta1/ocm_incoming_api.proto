syntax = "proto3";

package cs3.ocm.incoming.v1beta1;

import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/rpc/v1beta1/status.proto";
import "cs3/sharing/ocm/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/resources.proto";
import "cs3/types/v1beta1/types.proto";

option csharp_namespace = "Cs3.Ocm.Incoming.V1Beta1";
option go_package = "incomingv1beta1";
option java_multiple_files = true;
option java_outer_classname = "OcmIncomingApiProto";
option java_package = "com.cs3.ocm.incoming.v1beta1";
option objc_class_prefix = "COI";
option php_namespace = "Cs3\\Ocm\\Incoming\\V1Beta1";

// OCM Incoming API
//
// The OCM Incoming API is used to persist in the local system the incoming remote
// shares that are sent via the Open Cloud Mesh (OCM) sharing protocol.
// Implementations are expected to expose the `/ocm` endpoints according to the
// OCM API, and in response to those endpoints call the following API.
// Support for multi-protocol shares is included, if the remote sender supplies
// a multi-protocol share.
//
// The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL
// NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED",  "MAY", and
// "OPTIONAL" in this document are to be interpreted as described in
// RFC 2119.
//
// The following are global requirements that apply to all methods:
// Any method MUST return CODE_OK on a succesful operation.
// Any method MAY return NOT_IMPLEMENTED.
// Any method MAY return INTERNAL.
// Any method MAY return UNKNOWN.
// Any method MAY return UNAUTHENTICATED.
service OcmIncomingAPI {
  // Creates a new OCM share in response to a call from remote to `/ocm/shares`. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=v1.5.1&repo=OCM-API&user=cs3org#/paths/~1shares/post
  rpc CreateOCMIncomingShare(CreateOCMIncomingShareRequest) returns (CreateOCMIncomingShareResponse);
  // Updates an OCM share in response to a share-related notification from remote to
  // `/ocm/notifications`, namely SHARE_ACCEPTED, SHARE_DECLINED, SHARE_CHANGE_PERMISSION,
  // REQUEST_RESHARE and REQUEST_SHARE. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=v1.5.1&repo=OCM-API&user=cs3org#/paths/~1notifications/post
  rpc UpdateOCMIncomingShare(UpdateOCMIncomingShareRequest) returns (UpdateOCMIncomingShareResponse);
  // Deletes an OCM share in response to a share-related notification from remote to
  // `/ocm/notifications`, namely SHARE_UNSHARED, or a SHARE_DECLINED notification
  // declining a pending, collection-scoped share request. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=v1.5.1&repo=OCM-API&user=cs3org#/paths/~1notifications/post
  rpc DeleteOCMIncomingShare(DeleteOCMIncomingShareRequest) returns (DeleteOCMIncomingShareResponse);
}

// The type of OCM notification sent to `/ocm/notifications`, as per the
// notification types defined in the OCM Internet-Draft. This enum is meant
// to be extended as support for further notification types is added, and is
// defined here, centrally, for reuse across the different CS3 APIs that act
// upon such notifications (e.g. the Invite API). SHARE_UNSHARED is not
// listed here, as it always results in a plain DeleteOCMIncomingShare call
// with no further payload.
enum NotificationType {
  NOTIFICATION_TYPE_INVALID = 0;
  // The recipient accepted the share.
  NOTIFICATION_TYPE_SHARE_ACCEPTED = 1;
  // The recipient declined the share, or a collection-scoped share request.
  NOTIFICATION_TYPE_SHARE_DECLINED = 2;
  // The provider changed the permissions granted on the share.
  NOTIFICATION_TYPE_SHARE_CHANGE_PERMISSION = 3;
  // The recipient requests to reshare the resource with a third party.
  NOTIFICATION_TYPE_REQUEST_RESHARE = 4;
  // The recipient requests shares from a Collection.
  NOTIFICATION_TYPE_REQUEST_SHARE = 5;
  // The remote user left its own sync'n'share system entirely.
  NOTIFICATION_TYPE_USER_REMOVED = 6;
  // The remote user removed a local user from its list of trusted contacts.
  NOTIFICATION_TYPE_CONTACT_REMOVED = 7;
}

message CreateOCMIncomingShareRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // OPTIONAL.
  // Description for the share.
  string description = 2;
  // REQUIRED.
  // Name of the resource (file or folder).
  string name = 3;
  // REQUIRED.
  // Identifier to identify the resource at the provider side. This is unique per provider.
  string resource_id = 4;
  // REQUIRED.
  // Provider specific identifier of the owner of the resource.
  cs3.identity.user.v1beta1.UserId owner = 5;
  // REQUIRED.
  // Provider specific identifier of the user that wants to share the resource.
  cs3.identity.user.v1beta1.UserId sender = 6;
  // REQUIRED.
  // Consumer specific identifier of the user or group the provider wants to share the resource with.
  // This is known in advance, for example using the OCM invitation flow.
  // Please note that the consumer service endpoint is known in advance as well, so this is no part of the request body.
  // TODO: this field needs to represent either a user or group in the future, not only a user.
  cs3.identity.user.v1beta1.UserId share_with = 7;
  // REQUIRED.
  // Resource type.
  // Deprecated: a resource might not always be a storage resource, use shared_resource_type instead.
  cs3.storage.provider.v1beta1.ResourceType resource_type = 8 [deprecated = true];
  // REQUIRED.
  // Recipient share type.
  // Deprecated: use recipient_type instead.
  cs3.sharing.ocm.v1beta1.ShareType share_type = 9 [deprecated = true];
  // OPTIONAL.
  // The expiration time for the OCM share.
  cs3.types.v1beta1.Timestamp expiration = 10;
  // REQUIRED.
  // The protocols which are used to establish synchronisation,
  // with their access rights.
  // See also cs3/sharing/ocm/v1beta1/resources.proto for how to map
  // this to the OCM share payload.
  repeated cs3.sharing.ocm.v1beta1.Protocol protocols = 11;
  // OPTIONAL.
  // A nonce to be exchanged for a (potentially short-lived) bearer token. Deprecated in OCM 1.3.
  string code = 12 [deprecated = true];
  // REQUIRED.
  // Shared resource type.
  cs3.sharing.ocm.v1beta1.SharedResourceType shared_resource_type = 13;
  // REQUIRED.
  // Recipient type, e.g. user or group.
  cs3.sharing.ocm.v1beta1.RecipientType recipient_type = 14;
}

message CreateOCMIncomingShareResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // Unique ID to identify the share at the consumer side.
  string id = 3;
  // REQUIRED.
  cs3.types.v1beta1.Timestamp created = 4;
}

message UpdateOCMIncomingShareRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED, unless notification_type is NOTIFICATION_TYPE_REQUEST_SHARE: in
  // that case no incoming share exists yet, and collection_id MUST be set
  // instead to identify the Collection being requested.
  // Unique ID to identify the share at the consumer side.
  string ocm_share_id = 2;
  // OPTIONAL.
  // Description for the share.
  string description = 3;
  // OPTIONAL.
  // Recipient share type.
  // Deprecated: use recipient_type instead.
  cs3.sharing.ocm.v1beta1.ShareType share_type = 5 [deprecated = true];
  // OPTIONAL.
  // The expiration time for the OCM share.
  cs3.types.v1beta1.Timestamp expiration = 6;
  // OPTIONAL.
  // The protocols which are used to establish synchronisation,
  // with their access rights.
  repeated cs3.sharing.ocm.v1beta1.Protocol protocols = 7;
  // OPTIONAL.
  // Recipient type.
  cs3.sharing.ocm.v1beta1.RecipientType recipient_type = 8;
  // OPTIONAL.
  // Set when this update is triggered by an OCM notification, to identify
  // which one and determine which of the fields below apply.
  NotificationType notification_type = 9;
  // OPTIONAL.
  // A human-readable message accompanying the notification.
  string message = 10;
  // OPTIONAL.
  // New state of the received share. REQUIRED when notification_type is
  // NOTIFICATION_TYPE_SHARE_ACCEPTED or NOTIFICATION_TYPE_SHARE_DECLINED
  // for an existing share.
  cs3.sharing.ocm.v1beta1.ShareState state = 11;
  // OPTIONAL.
  // New permissions granted on the share. REQUIRED when notification_type
  // is NOTIFICATION_TYPE_SHARE_CHANGE_PERMISSION or
  // NOTIFICATION_TYPE_REQUEST_RESHARE.
  cs3.storage.provider.v1beta1.ResourcePermissions permissions = 12;
  // OPTIONAL.
  // Identifies the party the recipient wants to reshare the resource with.
  // REQUIRED when notification_type is NOTIFICATION_TYPE_REQUEST_RESHARE.
  cs3.identity.user.v1beta1.UserId reshare_with = 13;
  // OPTIONAL.
  // Identifier of the Collection being requested. REQUIRED when
  // notification_type is NOTIFICATION_TYPE_REQUEST_SHARE, in which case
  // ocm_share_id MUST be empty, owner identifies the owner of the
  // Collection, and permissions carries the requested permissions.
  string collection_id = 14;
  // OPTIONAL.
  // Owner of the Collection being requested. REQUIRED together with
  // collection_id.
  cs3.identity.user.v1beta1.UserId collection_owner = 15;
  // OPTIONAL.
  // Party requesting shares from the Collection. REQUIRED together with
  // collection_id.
  cs3.identity.user.v1beta1.UserId collection_share_with = 16;
}

message UpdateOCMIncomingShareResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
}

message DeleteOCMIncomingShareRequest {
  // REQUIRED, unless notification_type is NOTIFICATION_TYPE_SHARE_DECLINED
  // for a collection-scoped share request: in that case no incoming share
  // was ever created, and collection_id MUST be set instead.
  // Unique ID to identify the share at the consumer side.
  string id = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // OPTIONAL.
  // Set when this deletion is triggered by an OCM notification declining a
  // pending, collection-scoped share request rather than removing an
  // existing share (e.g. NOTIFICATION_TYPE_SHARE_UNSHARED does not need to
  // be set here, as it is the only notification type resulting in a plain
  // deletion by id).
  NotificationType notification_type = 3;
  // OPTIONAL.
  // A human-readable message accompanying the notification.
  string message = 4;
  // OPTIONAL.
  // Identifier of the Collection whose pending share request is being
  // declined. REQUIRED when notification_type is
  // NOTIFICATION_TYPE_SHARE_DECLINED and the request being declined was
  // collection-scoped; in that case id MUST be empty.
  string collection_id = 5;
  // OPTIONAL.
  // Party whose request to share the Collection is being declined.
  // REQUIRED together with collection_id.
  cs3.identity.user.v1beta1.UserId collection_share_with = 6;
}

message DeleteOCMIncomingShareResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
}
