syntax = "proto3";

package cs3.ocm.incoming.v1beta1;

import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/rpc/v1beta1/status.proto";
import "cs3/sharing/ocm/v1beta1/resources.proto";
import "cs3/storage/provider/v1beta1/resources.proto";
import "cs3/types/v1beta1/types.proto";

option csharp_namespace = "Cs3.Ocm.Incoming.V1Beta1";
option go_package = "incomingv1beta1";
option java_multiple_files = true;
option java_outer_classname = "OcmIncomingApiProto";
option java_package = "com.cs3.ocm.incoming.v1beta1";
option objc_class_prefix = "COI";
option php_namespace = "Cs3\\Ocm\\Incoming\\V1Beta1";

// OCM Incoming API
//
// The OCM Incoming API is used to persist in the local system the incoming remote
// shares that are sent via the Open Cloud Mesh (OCM) sharing protocol.
// Implementations are expected to expose the `/ocm` endpoints according to the
// OCM API, and in response to those endpoints call the following API.
// Support for multi-protocol shares is included, if the remote sender supplies
// a multi-protocol share.
//
// The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL
// NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED",  "MAY", and
// "OPTIONAL" in this document are to be interpreted as described in
// RFC 2119.
//
// The following are global requirements that apply to all methods:
// Any method MUST return CODE_OK on a succesful operation.
// Any method MAY return NOT_IMPLEMENTED.
// Any method MAY return INTERNAL.
// Any method MAY return UNKNOWN.
// Any method MAY return UNAUTHENTICATED.
service OcmIncomingAPI {
  // Creates a new OCM share in response to a call from remote to `/ocm/shares`. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=v1.2.0&repo=OCM-API&user=cs3org#/paths/~1shares/post
  rpc CreateOCMIncomingShare(CreateOCMIncomingShareRequest) returns (CreateOCMIncomingShareResponse);
  // Updates an OCM share in response to a notification from remote to `/ocm/notifications`. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=v1.2.0&repo=OCM-API&user=cs3org#/paths/~1notifications/post
  rpc UpdateOCMIncomingShare(UpdateOCMIncomingShareRequest) returns (UpdateOCMIncomingShareResponse);
  // Deletes an OCM share in response to a notification from remote to `/ocm/notifications`. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=v1.2.0&repo=OCM-API&user=cs3org#/paths/~1notifications/post
  rpc DeleteOCMIncomingShare(DeleteOCMIncomingShareRequest) returns (DeleteOCMIncomingShareResponse);
  // Withdraws an incoming share on `SHARE_UNSHARED` sent to
  // `/ocm/notifications`. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=26b2ff35334bdd488856191a6f9aa1e9b22bef85&repo=OCM-API&user=cs3org#/paths/~1notifications/post
  // Shares with no expiry or an expiry after selection are active, including
  // pending shares. Only authenticated internal callers may call after
  // HTTP signature verification and provider policy checks.
  // Denied origins return CODE_PERMISSION_DENIED. Invalid input returns
  // CODE_INVALID_ARGUMENT. A confirmed no-match returns CODE_OK with
  // changed=false. Failed or uncertain commits return an error.
  rpc WithdrawOCMIncomingShare(WithdrawOCMIncomingShareRequest) returns (WithdrawOCMIncomingShareResponse);
  // Replaces permission snapshots on `SHARE_CHANGE_PERMISSION` sent to
  // `/ocm/notifications`. See:
  // https://cs3org.github.io/OCM-API/docs.html?branch=26b2ff35334bdd488856191a6f9aa1e9b22bef85&repo=OCM-API&user=cs3org#/paths/~1notifications/post
  // Uses WithdrawOCMIncomingShare's selection, caller and commit rules.
  // The caller maps the notice to the applicable protocol.
  // Invalid input or no supplied snapshot returns CODE_INVALID_ARGUMENT.
  // Unsupported snapshots MAY return CODE_UNIMPLEMENTED before lookup.
  // A matched grant lacking a requested protocol returns
  // CODE_FAILED_PRECONDITION. Both refusals leave the grant unchanged.
  // For a supported snapshot, no match or no change returns CODE_OK
  // with changed=false.
  rpc ChangeOCMIncomingSharePermissions(ChangeOCMIncomingSharePermissionsRequest) returns (ChangeOCMIncomingSharePermissionsResponse);
}

message CreateOCMIncomingShareRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // OPTIONAL.
  // Description for the share.
  string description = 2;
  // REQUIRED.
  // Name of the resource (file or folder).
  string name = 3;
  // REQUIRED.
  // Identifier to identify the resource at the provider side. This is unique per provider.
  string resource_id = 4;
  // REQUIRED.
  // Provider specific identifier of the owner of the resource.
  cs3.identity.user.v1beta1.UserId owner = 5;
  // REQUIRED.
  // Provider specific identifier of the user that wants to share the resource.
  cs3.identity.user.v1beta1.UserId sender = 6;
  // REQUIRED.
  // Consumer specific identifier of the user or group the provider wants to share the resource with.
  // This is known in advance, for example using the OCM invitation flow.
  // Please note that the consumer service endpoint is known in advance as well, so this is no part of the request body.
  // TODO: this field needs to represent either a user or group in the future, not only a user.
  cs3.identity.user.v1beta1.UserId share_with = 7;
  // REQUIRED.
  // Resource type.
  // Deprecated: a resource might not always be a storage resource, use shared_resource_type instead.
  cs3.storage.provider.v1beta1.ResourceType resource_type = 8 [deprecated = true];
  // REQUIRED.
  // Recipient share type.
  // Deprecated: use recipient_type instead.
  cs3.sharing.ocm.v1beta1.ShareType share_type = 9 [deprecated = true];
  // OPTIONAL.
  // The expiration time for the OCM share.
  cs3.types.v1beta1.Timestamp expiration = 10;
  // REQUIRED.
  // The protocols which are used to establish synchronisation,
  // with their access rights.
  // See also cs3/sharing/ocm/v1beta1/resources.proto for how to map
  // this to the OCM share payload.
  repeated cs3.sharing.ocm.v1beta1.Protocol protocols = 11;
  // OPTIONAL.
  // A nonce to be exchanged for a (potentially short-lived) bearer token. Deprecated in OCM 1.3.
  string code = 12 [deprecated = true];
  // REQUIRED.
  // Shared resource type.
  cs3.sharing.ocm.v1beta1.SharedResourceType shared_resource_type = 13;
  // REQUIRED.
  // Recipient type, e.g. user or group.
  cs3.sharing.ocm.v1beta1.RecipientType recipient_type = 14;
}

message CreateOCMIncomingShareResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // Unique ID to identify the share at the consumer side.
  string id = 3;
  // REQUIRED.
  cs3.types.v1beta1.Timestamp created = 4;
}

message UpdateOCMIncomingShareRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // Unique ID to identify the share at the consumer side.
  string ocm_share_id = 2;
  // OPTIONAL.
  // Description for the share.
  string description = 3;
  // OPTIONAL.
  // Recipient share type.
  // Deprecated: use recipient_type instead.
  cs3.sharing.ocm.v1beta1.ShareType share_type = 5 [deprecated = true];
  // OPTIONAL.
  // The expiration time for the OCM share.
  cs3.types.v1beta1.Timestamp expiration = 6;
  // OPTIONAL.
  // The protocols which are used to establish synchronisation,
  // with their access rights.
  repeated cs3.sharing.ocm.v1beta1.Protocol protocols = 7;
  // OPTIONAL.
  // Recipient type.
  cs3.sharing.ocm.v1beta1.RecipientType recipient_type = 8;
}

message UpdateOCMIncomingShareResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
}

message DeleteOCMIncomingShareRequest {
  // REQUIRED.
  // Unique ID to identify the share at the consumer side.
  string id = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
}

message DeleteOCMIncomingShareResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
}

message WithdrawOCMIncomingShareRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // Grant provider's complete host[:port], compared after lowercasing only.
  string sender_domain = 2;
  // REQUIRED.
  // Provider-assigned grant ID.
  string remote_share_id = 3;
  // REQUIRED.
  // Resource type to match on the grant.
  cs3.sharing.ocm.v1beta1.SharedResourceType shared_resource_type = 4;
  // OPTIONAL.
  // Match the recipient type unless it is RECIPIENT_TYPE_INVALID.
  cs3.sharing.ocm.v1beta1.RecipientType recipient_type = 5;
  reserved 6;
  reserved "legacy_shared_secret";
  // OPTIONAL.
  // Notification sender's IP address for provider policy.
  string sender_ip = 7;
}

message WithdrawOCMIncomingShareResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // True if this call withdrew at least one received share.
  bool changed = 3;
}

message ChangeOCMIncomingSharePermissionsRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // Grant provider's complete host[:port], compared after lowercasing only.
  string sender_domain = 2;
  // REQUIRED.
  // Provider-assigned grant ID.
  string remote_share_id = 3;
  // REQUIRED.
  // Resource type to match on the grant.
  cs3.sharing.ocm.v1beta1.SharedResourceType shared_resource_type = 4;
  // OPTIONAL.
  // Match the recipient type unless it is RECIPIENT_TYPE_INVALID.
  cs3.sharing.ocm.v1beta1.RecipientType recipient_type = 5;
  // OPTIONAL.
  // Notification sender's IP address for provider policy.
  string sender_ip = 6;
  // OPTIONAL.
  // WebDAV snapshot, including reshare. Omit to leave it unchanged.
  // An empty message clears permissions and reshare.
  cs3.sharing.ocm.v1beta1.SharePermissions webdav_permissions = 7;
  // OPTIONAL.
  // Webapp snapshot. Omit to leave it unchanged. An empty message clears it.
  cs3.storage.provider.v1beta1.ResourcePermissions webapp_permissions = 8;
}

message ChangeOCMIncomingSharePermissionsResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // True if this call changed the permissions of at least one received share.
  bool changed = 3;
}
