syntax = "proto3";

package cs3.ocm.invite.v1beta1;

import "cs3/identity/user/v1beta1/resources.proto";
import "cs3/ocm/invite/v1beta1/resources.proto";
import "cs3/ocm/provider/v1beta1/resources.proto";
import "cs3/rpc/v1beta1/status.proto";
import "cs3/types/v1beta1/types.proto";

option csharp_namespace = "Cs3.Ocm.Invite.V1Beta1";
option go_package = "invitev1beta1";
option java_multiple_files = true;
option java_outer_classname = "InviteApiProto";
option java_package = "com.cs3.ocm.invite.v1beta1";
option objc_class_prefix = "COI";
option php_namespace = "Cs3\\Ocm\\Invite\\V1Beta1";

// Invite API
//
// The Invite API is meant to invite users and groups belonging to other
// sync'n'share systems, so that collaboration of resources can be enabled.
//
// The following APIs match the OCM v1.1 spec for the /invite-accepted endpoint.
//
// The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL
// NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED",  "MAY", and
// "OPTIONAL" in this document are to be interpreted as described in
// RFC 2119.
//
// The following are global requirements that apply to all methods:
// Any method MUST return CODE_OK on a succesful operation.
// Any method MAY return NOT_IMPLEMENTED.
// Any method MAY return INTERNAL.
// Any method MAY return UNKNOWN.
// Any method MAY return UNAUTHENTICATED.
service InviteAPI {
  // Generates a new token for the user with a validity of 24 hours.
  rpc GenerateInviteToken(GenerateInviteTokenRequest) returns (GenerateInviteTokenResponse);
  // Lists the valid tokens generated by the user.
  rpc ListInviteTokens(ListInviteTokensRequest) returns (ListInviteTokensResponse);
  // Forwards a received invite to the remote sync'n'share system provider. The remote
  // system SHALL get an `invite-accepted` call as follows:
  // https://cs3org.github.io/OCM-API/docs.html?branch=v1.2.0&repo=OCM-API&user=cs3org#/paths/~1invite-accepted/post
  // MUST return CODE_NOT_FOUND if the token does not exist.
  // MUST return CODE_INVALID_ARGUMENT if the token expired.
  // MUST return CODE_ALREADY_EXISTS if the user already accepted an invite.
  // MUST return CODE_PERMISSION_DENIED if the remote service is not trusted to accept invitations.
  rpc ForwardInvite(ForwardInviteRequest) returns (ForwardInviteResponse);
  // Completes an invitation acceptance.
  // MUST return CODE_NOT_FOUND if the token does not exist.
  // MUST return CODE_INVALID_ARGUMENT if the token expired.
  // MUST return CODE_ALREADY_EXISTS if the user already accepted an invite.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  // Retrieves details about a remote user who has accepted an invite to share.
  // MUST return CODE_NOT_FOUND if the user does not exist.
  rpc GetAcceptedUser(GetAcceptedUserRequest) returns (GetAcceptedUserResponse);
  // Finds users who accepted invite tokens by their attributes.
  rpc FindAcceptedUsers(FindAcceptedUsersRequest) returns (FindAcceptedUsersResponse);
  // Delete a previously accepted remote user, that is unfriend that user.
  // MUST return CODE_NOT_FOUND if the user does not exist.
  rpc DeleteAcceptedUser(DeleteAcceptedUserRequest) returns (DeleteAcceptedUserResponse);
  // Removes the contact between a remote actor and a local counterpart in
  // response to a CONTACT_REMOVED notification from remote to
  // `/ocm/notifications`. Only this exact pair is removed, and no
  // notification is sent back.
  // MUST return CODE_OK with changed=false if the pair is not a contact.
  // MUST return CODE_PERMISSION_DENIED if the provider policy denies the origin.
  // MUST return CODE_INVALID_ARGUMENT if the identities do not match the
  // sender domain or the local provider.
  rpc RemoveOCMContact(RemoveOCMContactRequest) returns (RemoveOCMContactResponse);
  // Reports whether this service can remove single contacts with RemoveOCMContact.
  rpc GetOCMContactRemovalSupport(GetOCMContactRemovalSupportRequest) returns (GetOCMContactRemovalSupportResponse);
}

message GenerateInviteTokenRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // OPTIONAL.
  // The description of the token.
  string description = 2;
}

message GenerateInviteTokenResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // The generated token.
  InviteToken invite_token = 3;
}

message ListInviteTokensRequest {}

message ListInviteTokensResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // REQUIRED.
  // The list of valid tokens.
  repeated InviteToken invite_tokens = 2;
}

message ForwardInviteRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // The token to authenticate with.
  InviteToken invite_token = 2;
  // REQUIRED.
  // The details of the sync'n'share system provider of the user who sent the invite.
  cs3.ocm.provider.v1beta1.ProviderInfo origin_system_provider = 3;
}

message ForwardInviteResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // The initiator's user id of the workflow.
  cs3.identity.user.v1beta1.UserId user_id = 3;
  // REQUIRED.
  // The initiator's email of the workflow.
  string email = 4;
  // REQUIRED.
  // The initiator's display name of the workflow.
  string display_name = 5;
}

message AcceptInviteRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // The token to authenticate with.
  InviteToken invite_token = 2;
  // REQUIRED.
  // The user who accepted the invite.
  cs3.identity.user.v1beta1.User remote_user = 3;
}

message AcceptInviteResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // The initiator's user id of the workflow.
  cs3.identity.user.v1beta1.UserId user_id = 3;
  // REQUIRED.
  // The initiator's email of the workflow.
  string email = 4;
  // REQUIRED.
  // The initiator's display name of the workflow.
  string display_name = 5;
}

message GetAcceptedUserRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // The id of the user.
  cs3.identity.user.v1beta1.UserId remote_user_id = 2;
}

message GetAcceptedUserResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // The user information.
  cs3.identity.user.v1beta1.User remote_user = 3;
}

message FindAcceptedUsersRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // The filter to apply.
  string filter = 2;
}

message FindAcceptedUsersResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // The accepted users matching the specified filter.
  repeated cs3.identity.user.v1beta1.User accepted_users = 3;
}

message DeleteAcceptedUserRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // The id of the user.
  cs3.identity.user.v1beta1.UserId remote_user_id = 2;
  // OPTIONAL.
  // Withdraw the authenticated user's outgoing OCM shares with the remote
  // user. Defaults to false: without either option the operation only
  // unlinks the contact and keeps existing shares in both directions.
  bool withdraw_outgoing = 3;
  // OPTIONAL.
  // Reject the authenticated user's received OCM shares from the remote
  // user. Defaults to false.
  bool decline_incoming = 4;
}

message DeleteAcceptedUserResponse {
  // REQUIRED.
  // The response status. It is CODE_OK only if every requested action
  // completed; a non-OK status can still carry an authoritative partial
  // result.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // OPTIONAL.
  // Per-action outcomes of the requested operation, present whenever the
  // outcome is known, including for recognized partial completion.
  ContactRemovalResult result = 3;
}

message ContactRemovalResult {
  // REQUIRED.
  // Outcome of unlinking the contact itself.
  ContactActionResult contact = 1;
  // REQUIRED.
  // Outcome of the optional withdrawal of outgoing shares.
  ContactActionResult outgoing = 2;
  // REQUIRED.
  // Outcome of the optional rejection of incoming shares.
  ContactActionResult incoming = 3;
}

message ContactActionResult {
  // REQUIRED.
  // The outcome of one action. CONTACT_ACTION_OUTCOME_INVALID is never a
  // valid completed value.
  ContactActionOutcome outcome = 1;
  // OPTIONAL.
  // Present only with CONTACT_ACTION_OUTCOME_SUCCEEDED: zero or one for
  // the contact action, the number of changed grants or received share
  // projections for a share action. Never fabricated for unknown outcomes.
  optional uint64 changed = 2;
}

enum ContactActionOutcome {
  // Not a valid completed value.
  CONTACT_ACTION_OUTCOME_INVALID = 0;
  // The action was not requested.
  CONTACT_ACTION_OUTCOME_NOT_REQUESTED = 1;
  // The action was requested but not attempted because an earlier
  // requested action did not complete successfully.
  CONTACT_ACTION_OUTCOME_NOT_ATTEMPTED = 2;
  // The action completed successfully.
  CONTACT_ACTION_OUTCOME_SUCCEEDED = 3;
  // The action was attempted and failed without a committed effect.
  CONTACT_ACTION_OUTCOME_FAILED = 4;
  // The outcome cannot be confirmed, for example after an ambiguous
  // commit or a lost reply.
  CONTACT_ACTION_OUTCOME_UNKNOWN = 5;
}

message RemoveOCMContactRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
  // REQUIRED.
  // The remote user who removed the contact. Its idp is the sender domain,
  // compared as a whole host[:port] after lowercasing only.
  cs3.identity.user.v1beta1.UserId actor = 2;
  // REQUIRED.
  // The local user whose contact with the actor is removed. Its idp is the
  // complete host[:port] of the local provider.
  cs3.identity.user.v1beta1.UserId counterpart = 3;
  // REQUIRED.
  // Host of the provider that sent the notification: the server part of
  // an OCM address, host[:port], with its complete port.
  string sender_domain = 4;
  // OPTIONAL.
  // Address of the HTTP client that sent the notification, used by the
  // provider policy.
  string sender_ip = 5;
}

message RemoveOCMContactResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // True if this call removed the contact.
  bool changed = 3;
}

message GetOCMContactRemovalSupportRequest {
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 1;
}

message GetOCMContactRemovalSupportResponse {
  // REQUIRED.
  // The response status.
  cs3.rpc.v1beta1.Status status = 1;
  // OPTIONAL.
  // Opaque information.
  cs3.types.v1beta1.Opaque opaque = 2;
  // REQUIRED.
  // True if RemoveOCMContact is supported.
  bool supported = 3;
}
